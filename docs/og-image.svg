<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Songsky social preview: Music that follows your sky.</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151840" />
      <stop offset=".6" stop-color="#3d3270" />
      <stop offset="1" stop-color="#9e4a55" />
    </linearGradient>
    <radialGradient id="glow" cx="930" cy="470" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6b26b" stop-opacity=".55" />
      <stop offset="1" stop-color="#f6b26b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tilesky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2150" />
      <stop offset=".62" stop-color="#4b3b7a" />
      <stop offset="1" stop-color="#e07a5f" />
    </linearGradient>
    <radialGradient id="tileglow" cx=".5" cy=".7" r=".6">
      <stop offset="0" stop-color="#f6b26b" stop-opacity=".5" />
      <stop offset="1" stop-color="#f6b26b" stop-opacity="0" />
    </radialGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14" /></clipPath>
    <clipPath id="above"><rect width="64" height="44" /></clipPath>
  </defs>

  <!-- Sky and horizon -->
  <rect width="1200" height="630" fill="url(#sky)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect y="470" width="1200" height="160" fill="#10132b" />
  <path d="M0 470H1200" stroke="#f6b26b" stroke-opacity=".5" stroke-width="2" />
  <g stroke="#f6b26b" stroke-linecap="round" stroke-width="6">
    <path d="M800 506h260" opacity=".45" />
    <path d="M850 534h160" opacity=".28" />
    <path d="M895 560h70" opacity=".15" />
  </g>

  <!-- Mark -->
  <g transform="translate(790 150) scale(4.4)">
    <g clip-path="url(#tile)">
      <rect width="64" height="64" fill="url(#tilesky)" />
      <rect width="64" height="64" fill="url(#tileglow)" />
      <rect y="44" width="64" height="20" fill="#161a36" />
      <circle cx="27" cy="44" r="11" fill="#f6b26b" clip-path="url(#above)" />
      <g fill="none" stroke="#f6b26b" stroke-linecap="round" stroke-width="3.4">
        <path d="M36.5 44V15" />
        <path d="M36.5 15c3.5 5.5 10.5 6.5 10.5 14" />
      </g>
      <g stroke="#f6b26b" stroke-linecap="round" stroke-width="2.4">
        <path d="M18 50h18" opacity=".55" />
        <path d="M22 55h10" opacity=".3" />
      </g>
    </g>
  </g>

  <!-- Words -->
  <text
    x="88"
    y="250"
    font-family="Syne"
    font-weight="700"
    font-size="124"
    letter-spacing="-4"
    fill="#f4f5fb"
  >
    songsky
  </text>
  <text x="92" y="318" font-family="DM Sans" font-weight="500" font-size="40" fill="#ecdfe8">
    Music that follows your sky.
  </text>
  <text x="92" y="376" font-family="DM Sans" font-weight="400" font-size="25" fill="#c9bfd6">
    A free web music player for the songs on your device.
  </text>
  <text x="92" y="555" font-family="DM Sans" font-weight="500" font-size="28" fill="#f6b26b">
    songsky.subashsdhami.com.np
  </text>
</svg>
