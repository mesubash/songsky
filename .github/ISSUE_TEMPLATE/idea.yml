name: Idea or improvement
description: Suggest something new or better.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea, and what you'd use it for.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
